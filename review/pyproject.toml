[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-review"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-article==1.0.0", "paper-browser==1.0.0", "paper-cards==1.0.0", "paper-codex-desktop-chat==1.0.0", "paper-core==1.0.0", "paper-correction==1.0.0", "paper-read==1.0.0", "paper-reading==1.0.0", "PyMuPDF>=1.24", "Pillow>=10"]

[tool.setuptools]
packages = ["review", "review.tests"]
package-dir = {"review" = "."}

[tool.setuptools.package-data]
review = ["interface.json", "docs/*.md"]
