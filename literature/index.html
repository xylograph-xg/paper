<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>文献标签与主题学习</title>
<meta name="paper-passwordless" content="__PAPER_PASSWORDLESS__">
<style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#223b39;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{background:#173c39;color:#fff;padding:24px 5vw}h1{margin:0;font-size:25px}header p{margin:4px 0;opacity:.8}a{color:inherit}main{max-width:1450px;margin:auto;padding:24px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}aside,.panel,article{background:white;border:1px solid #dce5de;border-radius:10px;padding:18px;margin-bottom:16px}aside{align-self:start;position:sticky;top:16px}h2{font-size:18px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}label{display:block;margin:10px 0;font-size:13px}input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid #bfcfc8;border-radius:5px;background:white;color:inherit}select[multiple]{min-height:85px}textarea{min-height:85px;resize:vertical}button{font:inherit;color:#174e43;border:1px solid #bfcfc8;border-radius:5px;padding:7px 12px;background:white;cursor:pointer}button.primary{background:#21675d;color:white;border:0}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=checkbox]{width:auto}small,.muted{font-size:13px;color:#657772}.badge{display:inline-block;border-radius:5px;padding:2px 7px;background:#e7f1ea;margin:4px 5px 4px 0;font-size:12px}.badge.candidate{background:#fff0d7}.error{color:#a0442d}#message{position:sticky;top:0;background:#fff8e9;z-index:1}#message:empty{display:none}dialog{width:min(820px,94vw);max-height:90vh;overflow:auto;border:1px solid #c4d3cb;border-radius:12px;padding:24px}dialog::backdrop{background:#173c3970}details{margin:8px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 inherit}.evidence{border-left:3px solid #b4cfc0;padding-left:12px;margin:12px 0}.selected{outline:2px solid #76a494}.empty{padding:45px;text-align:center;color:#657772}#collectionInfo:empty{display:none}#loginBox{max-width:450px;margin:30px auto}.year{display:grid;grid-template-columns:1fr 1fr;gap:8px}#tagList{max-height:260px;overflow:auto}#tagList button{margin:3px}@media(max-width:850px){main{display:block;padding:14px}aside{position:static}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.year{display:block}header{padding:18px}h1{font-size:22px}}
</style>
<header><div class="row"><h1>文献标签与主题学习</h1><a href="/">返回精读工作台</a></div><p>整理全部已登记文献 · 按证据归类 · 围绕问题组织阅读</p></header>
<section id="loginBox" class="panel" hidden><h2>登录工作台</h2><form id="loginForm"><label>访问口令<input id="accessToken" type="password" required autocomplete="off"></label><button class="primary">登录</button></form><p id="loginError" class="error" role="alert"></p></section>
<div id="message" role="status" aria-live="polite"></div>
<main id="app" hidden>
<aside><h2>检索与筛选</h2><form id="filters"><label>标题、摘要、DOI、标签或别名<input id="search" type="search" maxlength="500" placeholder="例如 RISC"></label><div class="year"><label>起始年份<input id="yearFrom" type="number" min="1000" max="3000"></label><label>结束年份<input id="yearTo" type="number" min="1000" max="3000"></label></div><label>原文<select id="hasPdf"><option value="">全部</option><option value="true">已登记原文</option><option value="false">尚无原文</option></select></label><label>标注状态<select id="tagState"><option value="all">全部有效标注</option><option value="automatic">自动证据通过</option><option value="confirmed">历史确认</option><option value="candidate">旧候选（保留）</option></select></label><details><summary>多维标签（同维度或，跨维度且）</summary><div id="dimensionFilters" class="filters"></div><small>按核心标签及其上位分类筛选；辅助证据见详情。可按住 ⌘ / Ctrl 多选。</small></details><div class="row"><button class="primary">应用筛选</button><button id="clear" type="button">清空</button></div></form><hr><button id="vocabulary">维护标签词表</button></aside>
<section><div class="panel"><h2>主题学习集合</h2><div class="row"><select id="collection" aria-label="当前学习集合" style="flex:1;width:auto"><option value="">全部文献</option></select><button id="newCollection">新建集合</button><button id="editCollection" disabled>编辑集合</button></div><div id="collectionInfo"></div></div>
<div class="row"><strong id="count"></strong><button id="batchTag">自动标注所选文献</button><span id="selection" class="muted"></span></div><div id="papers"></div><div class="row"><button id="previous">上一页</button><span id="page" class="muted"></span><button id="next">下一页</button></div></section></main>
<dialog id="editor"><div class="row" style="justify-content:space-between"><h2 id="editorTitle"></h2><button id="closeEditor">关闭</button></div><div id="editorBody"></div></dialog>
<script type="module" nonce="__CSP_NONCE__" src="/literature/app.js"></script></html>
