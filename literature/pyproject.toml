[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-literature"
version = "0.7.0"
requires-python = ">=3.11"
dependencies = ["paper-core==1.0.0", "paper-read==1.0.0"]

[tool.setuptools]
packages = ["literature", "literature.tests", "literature.experiments", "literature.experiments.l2_lab"]
package-dir = {"literature" = "."}

[tool.setuptools.package-data]
literature = ["interface.json", "taxonomy.json", "*.html", "*.js", "README.md", "REFERENCES.md", "AUTOMATIC_TAGGING.md", "ITERATION.md"]

"literature.experiments.l2_lab" = ["concepts.json", "interface.json", "README.md", "RESEARCH.md"]
