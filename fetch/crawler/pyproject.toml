[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-crawler"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["crawler", "crawler.literature_explorer.connectors", "crawler.literature_explorer.discovery", "crawler.literature_explorer.models", "crawler.literature_explorer.ranking", "crawler.literature_explorer.screening", "crawler.literature_explorer.storage"]
package-dir = {"crawler" = "."}

[tool.setuptools.package-data]
crawler = ["interface.json"]
