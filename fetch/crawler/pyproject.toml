[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-crawler"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-literature-explorer==1.0.0"]

[tool.setuptools]
packages = ["crawler"]
package-dir = {"crawler" = "."}

[tool.setuptools.package-data]
crawler = ["interface.json"]
