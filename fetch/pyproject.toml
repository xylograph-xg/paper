[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-fetch"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-core==1.0.0", "paper-crawler==1.0.0"]

[tool.setuptools]
packages = ["fetch", "fetch.tests", "fetch.vendor"]
package-dir = {"fetch" = "."}

[tool.setuptools.package-data]
fetch = ["interface.json", "docs/*.md"]
