[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "paper-pipeline-compat"
version = "1.0.0"
requires-python = ">=3.11"
[tool.setuptools]
packages = ["pipeline"]
package-dir = {pipeline = "."}
[tool.setuptools.package-data]
pipeline = ["interface.json"]
