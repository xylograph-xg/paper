[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "paper-docs"
version = "1.0.0"
requires-python = ">=3.11"
[tool.setuptools]
packages = ["docs"]
package-dir = {docs = "."}
[tool.setuptools.package-data]
docs = ["interface.json", "*.md", "*.html", "authorizations/*.md"]
