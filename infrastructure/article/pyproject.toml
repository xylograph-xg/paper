[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-article"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-browser==1.0.0", "paper-core==1.0.0"]

[tool.setuptools]
packages = ["article", "article.src", "article.tests"]
package-dir = {"article" = "."}

[tool.setuptools.package-data]
article = ["interface.json", "*.html", "docs/*.md", "vendor/*.js", "vendor/*.css", "vendor/fonts/*", "vendor/contrib/*"]
