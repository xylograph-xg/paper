[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-browser"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-oled-formulas==1.0.0", "paper-cards==1.0.0", "paper-codex-desktop-chat==1.0.0", "paper-core==1.0.0", "paper-correction==1.0.0", "paper-reading==1.0.0", "paper-review==1.0.0", "playwright>=1.40", "pymupdf==1.28.2", "Pillow>=10"]

[tool.setuptools]
packages = ["browser", "browser.tests"]
package-dir = {"browser" = "."}

[tool.setuptools.package-data]
browser = ["interface.json", "*.html", "docs/*.md", "vendor/*.js", "vendor/*.css", "vendor/fonts/*", "vendor/contrib/*"]
