[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "paper-infrastructure"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-core==1.0.0", "paper-browser==1.0.0", "paper-maintenance==1.0.0", "paper-article==1.0.0"]
[tool.setuptools]
packages = ["infrastructure"]
package-dir = {"infrastructure" = "."}
[tool.setuptools.package-data]
infrastructure = ["interface.json"]
