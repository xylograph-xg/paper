[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-browser==1.0.0", "paper-cards==1.0.0", "paper-core==1.0.0", "paper-fetch==1.0.0", "paper-read==1.0.0", "paper-review==1.0.0", "PyMuPDF>=1.24", "Pillow>=10"]

[tool.setuptools]
packages = ["reading", "reading.tests"]
package-dir = {"reading" = "."}

[tool.setuptools.package-data]
reading = ["interface.json", "requirements-*.txt", "*.html", "docs/*.md", "vendor/*.js", "vendor/*.css", "vendor/fonts/*", "vendor/contrib/*"]
