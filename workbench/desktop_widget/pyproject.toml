[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-desktop-widget"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-oled-formulas==1.0.0", "paper-cards==1.0.0", "paper-browser==1.0.0", "paper-core==1.0.0", "paper-literature==0.7.0", "paper-correction==1.0.0", "paper-review==1.0.0"]

[tool.setuptools]
packages = ["desktop_widget"]
package-dir = {"desktop_widget" = "."}

[tool.setuptools.package-data]
desktop_widget = ["interface.json", "*.html", "docs/*.md", "vendor/*.js", "vendor/*.css", "vendor/fonts/*", "vendor/contrib/*"]
