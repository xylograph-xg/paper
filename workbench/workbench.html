<script type="module" nonce="__CSP_NONCE__">
import {marked} from '/vendor/marked.esm.js';
const passwordless=document.querySelector('meta[name=paper-passwordless]').content==='true';
let token='',state={papers:[],jobs:[]},tab='deep',pageOffset=0;
let curatedPage='ordinary',manualPage='seeds';
function currentLibraryTab(){return tab==='deep'?(curatedPage==='ordinary'?'deep_regular':manualPage==='seeds'?'deep_manual_seeds':'deep_manual_derived'):tab;}
const pageSize=100;
const detailState=new Map(),cardHTML=new Map();let refreshing=false,refreshPromise=null,refreshQueued=false,searchIndex=new Map();
function searchableText(p){const m=p.metadata||{},a=p.assessment||{};return [p.title,m.doi,m.venue,m.year,m.abstract,...(m.authors||[]).map(x=>typeof x==='string'?x:x.name),p.card_work_summary,p.card_key_findings,a.core_findings,a.recommendation_reason,a.novelty,...(a.tags||[]),p.note].filter(Boolean).join(' ').normalize('NFKC').toLocaleLowerCase();}
function isReadingView(){return (tab==='deep'||tab==='read')&&!(document.querySelector('#paperSearch').value&&document.querySelector('#searchScope').value==='all');}
document.addEventListener('toggle',e=>{if(e.target.matches('details[data-detail]'))detailState.set(e.target.dataset.detail,e.target.open);},true);
const cardDialog=document.querySelector('#reader');let backdropPress=false;let readerRequest=0;
function outsideCard(e){const r=cardDialog.getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;}
cardDialog.addEventListener('pointerdown',e=>{backdropPress=outsideCard(e);});
cardDialog.addEventListener('click',e=>{if(e.target===cardDialog&&backdropPress&&outsideCard(e))cardDialog.close();backdropPress=false;});
cardDialog.addEventListener('pointercancel',()=>{backdropPress=false;});
cardDialog.addEventListener('close',()=>{readerRequest++;backdropPress=false;closeImageView();});
cardDialog.addEventListener('cancel',e=>{if(cardDialog.classList.contains('image-open')){e.preventDefault();closeImageView();}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(text){
 const maths=[],source=String(text??'');
 // These are temporary rendering markers, not security identifiers; LAN HTTP must work.
 let mathPrefix='MATH'+Math.random().toString(36).slice(2)+'X';
 while(source.includes(mathPrefix))mathPrefix+='X';
 const input=source.replace(/(\$\$[\s\S]+?\$\$|\$[^\n$]+?\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))/g,m=>{const i=maths.push(m)-1;return mathPrefix+i+'END';});
 const doc=new DOMParser().parseFromString(marked.parse(input),'text/html');
 const allowed=new Set(['P','BR','H1','H2','H3','H4','H5','H6','UL','OL','LI','STRONG','EM','BLOCKQUOTE','CODE','PRE','TABLE','THEAD','TBODY','TR','TH','TD','A','HR']);
 for(const el of [...doc.body.querySelectorAll('*')]){if(!allowed.has(el.tagName)){el.replaceWith(doc.createTextNode(el.textContent));continue;}const href=el.getAttribute('href');for(const a of [...el.attributes])el.removeAttribute(a.name);if(el.tagName==='A'&&/^https?:\/\//i.test(href||'')){el.setAttribute('href',href);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}}
 return doc.body.innerHTML.replace(new RegExp(mathPrefix+'(\\d+)END','g'),(_,i)=>esc(maths[Number(i)]||''));
}
function panelInfoProse(text){
 const source=String(text??''),maths=[...source.matchAll(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|`[^`\n]+`/g)].map(match=>({start:match.index,end:match.index+match[0].length}));
 const labels=[...source.matchAll(/(^|[。！？；;.\n]\s*)([a-z])\s*[:：]|(^|[\s。！？；;.,，])(?:\(([a-z])\)|（([a-z])）)/gi)].map(match=>({offset:match.index+(match[1]??match[3]).length,label:(match[2]||match[4]||match[5]).toLowerCase()})).filter(item=>!maths.some(math=>math.start<=item.offset&&item.offset<math.end));
 const cuts=new Set();for(let i=0;i<labels.length-1;i++){if(labels[i+1].label.charCodeAt(0)===labels[i].label.charCodeAt(0)+1){cuts.add(labels[i].offset);cuts.add(labels[i+1].offset);}}
 let separated='',start=0;for(const cut of [...cuts].sort((a,b)=>a-b)){if(cut>0){separated+=source.slice(start,cut)+'\n\n';start=cut;}}return md(separated+source.slice(start));
}
function figureInfo(text){
 if(!String(text??'').includes('｜'))return quantityInfo(text,true);
 const lines=String(text??'').split(/\r?\n/).filter(x=>x.trim());
 return lines.map(line=>{
  line=line.replace(/\[(?:p\.?\s*\d+|Fig\.?|Table)[^\]\n]*\]/gi,'').replace(/[（(](?:来源[：:]\s*)?(?:Caption|正文定义|正文)[）)]/gi,'');
  const fields=line.split('｜');
  if(fields.length<2)return `<div class="panel-info prose">${panelInfoProse(line)}</div>`;
  return `<section class="panel-info"><h5>${esc(fields.shift().trim())}</h5><dl>${fields.map(field=>{
   const match=field.trim().match(/^([^：:]+)[：:]([\s\S]*)$/);
   return match?`<div><dt>${esc(match[1])}</dt><dd>${panelInfoProse(match[2])}</dd></div>`:`<div><dd>${panelInfoProse(field)}</dd></div>`;
  }).join('')}</dl></section>`;
 }).join('');
}
function quantityInfo(text,panels=false){
 const clean=String(text??'').replace(/\[(?:p\.?\s*\d+|Fig\.?|Table)[^\]\n]*\]/gi,'').replace(/[（(](?:来源[：:]\s*)?(?:Caption|正文定义|正文)[）)]/gi,'');
 const lines=clean.split(/\r?\n/).map(x=>x.trim().replace(/^[-*]\s+/, '').replace(/｜/g,'：')).filter(Boolean);
 return `<ul>${lines.map(x=>`<li>${panels?panelInfoProse(x):md(x)}</li>`).join('')}</ul>`;
}
const acquisitionNames={available:'原文已获取',not_attempted:'尚未获取',needs_access_check:'需检查认证或访问限制',needs_manual_download:'需手动获取'};
const decisionNames={unreviewed:'未筛选',keep:'保留',later:'暂缓',reject:'忽略',deep_read:'已选精读',original_read:'核心原文阅读'};
async function fetchJSON(path,options={},notModified=false){
 const reading=(options.method||'GET').toUpperCase()==='GET';
 for(let attempt=0;;attempt++){
  let r;
  try{
   r=await fetch(path,options);if(notModified&&r.status===304)return {response:r,data:null};
   let body;try{body=await r.text();}catch{const e=Error('工作台响应中断，请稍后重试。');e.invalidResponse=true;throw e;}let data;
   try{data=JSON.parse(body);}catch{const e=Error(r.status===503?'工作台正忙，请稍后重试。':r.ok?'工作台返回的数据不完整，请稍后重试。':`工作台连接暂时不可用（HTTP ${r.status}），请确认后台服务仍在运行。`);e.invalidResponse=true;throw e;}
   if(!r.ok||!data||typeof data!=='object'){const e=Error(typeof data?.error==='string'?data.error:`工作台请求失败（HTTP ${r.status}）。`);e.invalidResponse=r.ok;throw e;}
   return {response:r,data};
  }catch(error){
   error.status=r?.status||0;
   const transient=!r||(r.ok&&error.invalidResponse)||[502,503,504].includes(r.status);
   if(reading&&transient&&attempt<2){const seconds=Number(r?.headers.get('Retry-After'));const delay=Number.isFinite(seconds)&&seconds>0?Math.min(seconds*1000,2000):500*(attempt+1);await new Promise(resolve=>setTimeout(resolve,delay));continue;}
   if(!reading&&(!r||error.invalidResponse))error.message='操作回执未确认，请刷新状态核对后再决定是否操作。';
   else if(!r)error.message='无法连接工作台，请确认后台服务仍在运行。';
   throw error;
  }
 }
}
function accessHeaders(){return token?{'X-Paper-Token':token}:{};}
async function post(path,data){return (await fetchJSON(path,{method:'POST',headers:{'Content-Type':'application/json',...accessHeaders()},body:JSON.stringify(data)})).data;}
async function changeSeed(id,enabled){return await post('/api/seed',{id,enabled});}
function message(s){document.querySelector('#message').textContent=s;}
async function action(fn){try{await fn();message('已保存，后台会继续处理。');await refresh();}catch(e){message(e.message);}}
let stateEtag=null;
async function refresh(){
 if(refreshing){refreshQueued=true;return refreshPromise;}refreshing=true;

function readingProse(text){
 const doc=new DOMParser().parseFromString(md(text),'text/html');
 for(const paragraph of [...doc.body.querySelectorAll('p')]){
  const source=paragraph.textContent;if(!source)continue;
  const maths=[...source.matchAll(/\$\$[\s\S]+?\$\$|\$[^\n$]+?\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/g)].map(match=>({start:match.index,end:match.index+match[0].length}));
  const cuts=new Set([...source.matchAll(/\r?\n/g)].map(match=>match.index+match[0].length));
  if(source.length>220){let start=0;for(const match of source.matchAll(/[。！？]|[.!?](?=\s+[A-Z])/g)){const end=match.index+match[0].length;if(end-start>=140){cuts.add(end);start=end;}}}
  const boundaries=[...cuts].filter(offset=>offset>0&&offset<source.length&&!maths.some(math=>math.start<offset&&offset<math.end)).sort((a,b)=>a-b);if(!boundaries.length)continue;
  const nodes=[],walker=doc.createTreeWalker(paragraph,NodeFilter.SHOW_TEXT);let node,offset=0;
  while(node=walker.nextNode()){nodes.push({node,start:offset,end:offset+node.length});offset+=node.length;}
  const point=position=>{const item=nodes.find(item=>position<=item.end);return {node:item.node,offset:position-item.start};};
  const replacement=doc.createDocumentFragment();let start=0;
  for(const end of [...boundaries,source.length]){const from=point(start),to=point(end),range=doc.createRange();range.setStart(from.node,from.offset);range.setEnd(to.node,to.offset);const p=doc.createElement('p');p.append(range.cloneContents());if(p.textContent.trim())replacement.append(p);start=end;}
  paragraph.replaceWith(replacement);
 }
 return doc.body.innerHTML;
}

 const summary=typeof c.one_line_summary==='string'&&c.one_line_summary.trim(),findings=typeof c.key_findings==='string'&&c.key_findings.trim();
 if(!summary&&!findings)return '';
 return `<div class="findings">${summary?`<div class="work-summary"><strong>工作总结</strong><div class="prose">${md(c.one_line_summary)}</div></div>`:''}${findings?summary?`<details class="core-findings"><summary>具体结论与证据</summary><div class="prose">${md(c.key_findings)}</div></details>`:`<strong>核心结论</strong><div class="prose">${md(c.key_findings)}</div>`:''}</div>`;
}
async function showCard(id){
 const requestId=++readerRequest;
 const manualCard=state.papers.find(p=>p.id===id)?.manual_seed_card;
 const params=new URLSearchParams({id});
 if(manualCard)params.set('sha256',manualCard.sha256);
 const {data:c}=await fetchJSON('/api/card?'+params);
 const media=path=>`/asset?id=${encodeURIComponent(id)}&file=${encodeURIComponent(path)}`;
 let html=`<h2>${esc(c.title)}</h2>${manualCard?.kind==='preview'?`<p class="notice">候选卡 · ${esc(manualCard.status)}</p>`:''}${readerSummaryHTML(c)}<details class="research-context" open><summary>研究动机与讨论</summary>${c.intro_summary?`<h4>研究动机</h4><div class="prose research-motivation">${readingProse(c.intro_summary)}</div>`:''}${c.conclusion_summary?`<h4>讨论</h4><div class="prose research-discussion">${readingProse(c.conclusion_summary)}</div>`:''}</details>`;
 let display={};
 // Web Crypto hashing may be unavailable on LAN HTTP; keep the original page image.
 if(typeof globalThis.crypto?.subtle?.digest==='function'){
  try{const dr=await fetch(media('display/index.json'));if(dr.ok){const index=await dr.json();const cr=await fetch(media('card.json'));if(cr.ok){const bytes=await cr.arrayBuffer();const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');if(hash===index.card_sha256)display=index.items||{};}}}catch{}
 }
 let positions={};const shownPages=new Set();
 try{const pr=await fetch(`/asset?id=${encodeURIComponent(id)}&file=parsed.json`);if(pr.ok){const parsed=await pr.json();for(const kind of ['figures','equations'])for(const item of parsed[kind]||[])positions[item.group_label||item.label]={page:item.crop_page??item.page,bbox:item.crop_bbox||item.group_bbox||item.bbox};}}catch{}
 const stored=new Map((c.meta?.reading_order||[]).map((x,i)=>[`${x.kind}:${x.index}`,i]));
 const items=[...(c.figures||[]).map((f,i)=>({f,i,kind:'figure',page:f.source_page??f.crop_page??f.caption_page})),...(c.equations||[]).map((f,i)=>({f,i,kind:'equation',page:f.source_page??f.page})),...(c.tables||[]).map((f,i)=>({f,i,kind:'table',page:f.source_page}))];
 items.sort((a,b)=>{if(stored.size)return (stored.get(`${a.kind}:${a.i}`)??1e6)-(stored.get(`${b.kind}:${b.i}`)??1e6);const pa=positions[a.f.label],pb=positions[b.f.label];return a.page-b.page||(pa?.bbox?.[1]??1e6)-(pb?.bbox?.[1]??1e6)||a.i-b.i;});
 for(const {f,i,kind} of items){
  const crop=display[`${kind==='figure'?'figures':kind==='equation'?'equations':'tables'}:${i}`];
  const validCrop=crop&&crop.label===f.label&&crop.source_page===f.source_page&&/^display\/[a-z]+-\d+\.png$/.test(crop.asset);
  const path=f.asset_file;
  const wholePage=path&&/^pages\/P\d+\.png$/.test(path);
  let figureImage='';
  if(path){
   const link=media(path);
   if(wholePage){
    figureImage=shownPages.has(path)?'':`<details class="secondary page-evidence"><summary>原文图像</summary><img loading="lazy" data-zoom-src="${esc(link)}" data-pdf-src="${esc(media('source.pdf')+(Number.isInteger(f.source_page)?`#page=${f.source_page}`:''))}" src="${esc(link)}" alt="原文整页图像"></details>`;
    shownPages.add(path);
   }else figureImage=`<img data-zoom-src="${esc(link)}" data-pdf-src="${esc(media('source.pdf')+(Number.isInteger(f.source_page)?`#page=${f.source_page}`:''))}" src="${esc(link)}" alt="${esc(f.label||'图式')}">`;
  }
  const pdfLink=media('source.pdf')+(Number.isInteger(f.source_page)?`#page=${f.source_page}`:'');
  const preview=validCrop?media(crop.asset):(path?media(path):'');
  if(validCrop)figureImage=`<img class="display-crop" data-zoom-src="${esc(preview)}" data-pdf-src="${esc(pdfLink)}" src="${esc(preview)}" alt="${esc(f.label)} 原文裁图">`+figureImage;
  if(preview)figureImage+=`<div class="image-actions"><button data-zoom-src="${esc(preview)}" data-pdf-src="${esc(pdfLink)}">放大查看</button></div>`;
  html+=`<details data-reading-item="${kind}:${i}" open><summary>${esc(f.label||'图式')}${f.one_line?' — '+esc(f.one_line):''}</summary>${figureImage}${['figure_info','quantities','columns','conditions','summary','detail','result'].filter(k=>f[k]).map(k=>`<section class="figure-section"><h4>${esc(({figure_info:'读图：面板与坐标',quantities:'物理量',columns:'表格列与单位',conditions:'条件',summary:'研究问题',detail:'观察与证据',result:'结论与边界'})[k])}</h4><div class="prose">${k==='figure_info'?figureInfo(f[k]):k==='quantities'?quantityInfo(f[k]):md(f[k])}</div></section>`).join('')}${f.caption?`<details class="secondary"><summary>原文图注</summary><div class="prose">${md(f.caption)}</div></details>`:''}${f.latex?`<details><summary>公式</summary><div class="prose">${md('$$'+f.latex+'$$')}</div></details>`:''}</details>`;
 }
 if(requestId!==readerRequest)return;
 closeImageView();readerSelection=[];document.querySelector('#cardBody').innerHTML=html;document.querySelector('#cardBody').scrollTop=0;
 if(window.renderMathInElement)renderMathInElement(document.querySelector('#cardBody'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false,trust:false});
 if(!cardDialog.open)cardDialog.showModal();document.querySelector('#closeReader').focus({preventScroll:true});document.querySelector('#cardBody').scrollTop=0;
}
let searchTimer;function changedFilter(){pageOffset=0;stateEtag='';clearTimeout(searchTimer);searchTimer=setTimeout(refresh,200);}
document.querySelector('#paperSearch').addEventListener('input',changedFilter);
document.querySelector('#searchScope').onchange=changedFilter;
document.querySelector('#clearSearch').onclick=()=>{document.querySelector('#paperSearch').value='';changedFilter();document.querySelector('#paperSearch').focus();};
document.querySelector('#channelFilter').onchange=changedFilter;
document.querySelector('#closeReader').onclick=()=>document.querySelector('#reader').close();
document.querySelector('#startContinuous').onclick=async()=>{const button=document.querySelector('#startContinuous');button.disabled=true;try{await post('/api/continuous/start',{});message('拉取和GPT制卡已启动；已有进程复用，已提交任务继续收取。');stateEtag='';await refresh();}catch(e){message(e.message);}finally{button.disabled=false;}};

let imageScale='fit',activeImageItem=null,readerSelection=[];
function rememberReaderSelection(){const selection=window.getSelection(),body=document.querySelector('#cardBody');if(!selection||selection.isCollapsed)return;readerSelection=[...Array(selection.rangeCount)].map((_,i)=>selection.getRangeAt(i).cloneRange()).filter(range=>body.contains(range.commonAncestorContainer));}
function restoreReaderSelection(){const ranges=readerSelection.filter(range=>document.querySelector('#cardBody').contains(range.commonAncestorContainer));if(!ranges.length)return;const selection=window.getSelection();selection.removeAllRanges();for(const range of ranges)selection.addRange(range);}
function closeImageView(){const viewer=document.querySelector('#imageViewer');viewer.hidden=true;viewer.removeAttribute('open');cardDialog.classList.remove('image-open');if(activeImageItem&&cardDialog.open)activeImageItem.scrollIntoView({block:'start'});activeImageItem=null;if(cardDialog.open)restoreReaderSelection();}
function setImageScale(scale){imageScale=scale;const img=document.querySelector('#fullImage');const viewport=document.querySelector('#imageViewport');img.style.width=(scale==='fit'?viewport.clientWidth:img.naturalWidth*Number(scale))+'px';img.style.height='auto';}
document.querySelector('#cardBody').addEventListener('pointerdown',e=>{if(e.target.closest('[data-zoom-src]'))rememberReaderSelection();});
document.querySelector('#imageViewer').addEventListener('pointerdown',rememberReaderSelection);
document.querySelector('#cardBody').addEventListener('click',e=>{const button=e.target.closest('[data-zoom-src]');if(!button)return;e.preventDefault();const img=document.querySelector('#fullImage'),viewer=document.querySelector('#imageViewer'),viewport=document.querySelector('#imageViewport');activeImageItem=button.closest('[data-reading-item]');viewer.hidden=false;viewer.setAttribute('open','');cardDialog.classList.add('image-open');viewport.scrollTop=0;viewport.scrollLeft=0;img.onload=()=>setImageScale('fit');img.src=button.dataset.zoomSrc;document.querySelector('#imagePdf').href=button.dataset.pdfSrc;requestAnimationFrame(()=>{if(img.complete&&img.naturalWidth)setImageScale('fit');activeImageItem?.scrollIntoView({block:'start'});restoreReaderSelection();});});
document.querySelectorAll('[data-image-zoom]').forEach(button=>button.onclick=()=>{setImageScale(button.dataset.imageZoom);restoreReaderSelection();});
document.querySelector('#closeImageViewer').onclick=closeImageView;
new ResizeObserver(()=>{if(cardDialog.classList.contains('image-open')&&imageScale==='fit')setImageScale('fit');}).observe(document.querySelector('#imageViewport'));

let authenticated=false;
async function login(value){
 try{await fetchJSON('/api/session',{method:'POST',headers:{'Content-Type':'application/json','X-Paper-Token':value},body:'{}'});}
 catch(error){if(error.status===403)error.message='访问口令无效，请使用当前启动器显示的链接或口令。';throw error;}
 token=value;authenticated=true;sessionStorage.setItem('paperAccessToken',value);
 document.querySelector('#login').close();await refresh();
}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();try{await login(document.querySelector('#accessToken').value.trim());}catch(err){document.querySelector('#loginError').textContent=err.message;}};
document.querySelector('#login').addEventListener('cancel',e=>e.preventDefault());
const access=new URLSearchParams(location.hash.slice(1)).get('access');
if(access)history.replaceState(null,'',location.pathname+location.search);
if(passwordless){
 sessionStorage.removeItem('paperAccessToken');
 authenticated=true;
 await refresh();
}else{
 const bootstrap=access||sessionStorage.getItem('paperAccessToken');
 if(bootstrap){try{await login(bootstrap);}catch(error){if(error.status===403)sessionStorage.removeItem('paperAccessToken');document.querySelector('#loginError').textContent=error.message;document.querySelector('#login').showModal();}}
 else document.querySelector('#login').showModal();
}
document.querySelector('#previousPage').onclick=()=>{pageOffset=Math.max(0,pageOffset-pageSize);stateEtag='';refresh();};
document.querySelector('#nextPage').onclick=()=>{pageOffset+=pageSize;stateEtag='';refresh();};
setInterval(()=>{if(authenticated&&document.visibilityState==='visible')refresh();},10000);
</script></html>
