[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-workbench"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-literature==0.7.0", "paper-browser==1.0.0", "paper-cards==1.0.0", "paper-core==1.0.0", "paper-correction==1.0.0", "paper-fetch==1.0.0", "paper-reading==1.0.0", "paper-review==1.0.0"]

[tool.setuptools]
packages = ["workbench", "workbench.tests"]
package-dir = {"workbench" = "."}

[tool.setuptools.package-data]
workbench = ["interface.json", "*.html", "docs/*.md", "vendor/*.js", "vendor/*.css", "vendor/fonts/*", "vendor/contrib/*"]
