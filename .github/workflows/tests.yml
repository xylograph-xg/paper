name: local-regression
on: [push, pull_request]
jobs:
  tests:
    runs-on: macos-latest
    env:
      PYTHONPATH: infrastructure/bootstrap:.
    defaults:
      run:
        working-directory: paper
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          repository: xylograph-xg/tools
          ref: 12df6b2ec481804cd269264e6fd5bd86e14d887e
          path: tools
          token: ${{ secrets.TOOLS_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r infrastructure/maintenance/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python infrastructure/maintenance/check_subprojects.py
      - run: python infrastructure/maintenance/test_runner.py
        env:
          PYTHONPATH: infrastructure/bootstrap:.
