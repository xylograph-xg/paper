[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-correction"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-browser==1.0.0", "paper-cards==1.0.0", "paper-core==1.0.0", "paper-review==1.0.0"]

[tool.setuptools]
packages = ["correction"]
package-dir = {"correction" = "."}

[tool.setuptools.package-data]
correction = ["interface.json"]
