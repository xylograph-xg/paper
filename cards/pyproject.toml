[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-cards"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["paper-oled-formulas==1.0.0", "paper-browser==1.0.0", "paper-codex-desktop-chat==1.0.0", "paper-core==1.0.0", "paper-correction==1.0.0", "paper-read==1.0.0", "paper-reading==1.0.0", "paper-review==1.0.0", "PyMuPDF>=1.24", "Pillow>=10"]

[tool.setuptools]
packages = ["cards", "cards.tests"]
package-dir = {"cards" = "."}

[tool.setuptools.package-data]
cards = ["interface.json", "docs/*.md"]
